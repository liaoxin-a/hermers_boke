{{ define "title" }}{{ .Title }} · {{ site.Title }}{{ end }}
{{ define "main" }}
<h2>{{ .Title }}</h2>
{{ range .Pages }}
<article class="post-excerpt">
  <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
  <p class="post-meta">{{ .Date.Format "2006-01-02" }}</p>
  {{ .Summary }}
</article>
{{ end }}
{{ end }}
